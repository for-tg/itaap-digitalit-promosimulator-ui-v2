# ============================================================================
# Utility Workflow: Create hotfix branch from a production release tag
# ============================================================================
#
# PURPOSE:
#   Automatically creates a hotfix/* branch from the latest (or specified)
#   release tag. This eliminates manual git commands and ensures the hotfix
#   starts from the exact code that was deployed to production.
#
# HOW TO USE:
#   1. Go to Actions → "Create Hotfix Branch" workflow → Run workflow
#   2. Select environment: prod (default) or acc
#   3. Enter a descriptive hotfix name (e.g., fix-header-alignment)
#   4. Click "Run workflow"
#
# WHAT HAPPENS AFTER:
#   - Developer pulls the created hotfix/* branch and commits the fix
#   - Push to hotfix/* triggers create-release.yml → auto-creates a release tag
#   - The release tag triggers cd.yml → deploys Test → ACC → Prod (skipping Dev)
#   - After Prod deployment, a PR is auto-created to merge the fix back to main
#
# NOTE: This workflow requires IT_EADI_API_MGMT_GIT_TOKEN secret with repo scope.
# ============================================================================

name: Create Hotfix Branch

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to hotfix (which release tag to branch from)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - acc
      hotfix_name:
        description: 'Hotfix name (e.g., fix-header-alignment). Spaces are auto-replaced with hyphens.'
        required: true
        default: 'fix-description-here'
        type: string

jobs:
  create-hotfix-branch:
    name: Create Hotfix Branch
    runs-on: [self-hosted, linux, x64, philips-code-hub, ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.IT_EADI_API_MGMT_GIT_TOKEN }}

      - name: Create hotfix branch from release tag
        env:
          GITHUB_TOKEN: ${{ secrets.IT_EADI_API_MGMT_GIT_TOKEN }}
        run: |
          set -e

          echo ""
          echo "============================================"
          echo "  HOTFIX BRANCH CREATION UTILITY"
          echo "  Environment: ${{ inputs.environment }}"
          echo "============================================"
          echo ""

          # Fetch all branches and tags
          git fetch --all --tags --prune

          ENV="${{ inputs.environment }}"

          # Find the latest release tag
          # Release tags follow semver: v1.0.0, v1.0.1, etc.
          LATEST_TAG=$(git tag -l "v*" --sort=-version:refname | head -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "  🚨 No release tags (v*) found in this repository."
            echo "  Cannot create a hotfix branch without a release tag."
            echo ""
            echo "  If this is a new project, create the hotfix branch manually:"
            echo "    git checkout -b hotfix/<name> main"
            echo "============================================"
            exit 1
          fi
          echo "  Latest release tag: $LATEST_TAG"

          # Validate hotfix name
          HOTFIX_NAME="${{ inputs.hotfix_name }}"
          if [ -z "$HOTFIX_NAME" ] || [ "$HOTFIX_NAME" = "fix-description-here" ]; then
            echo "  🚨 Please provide a descriptive hotfix name."
            echo "============================================"
            exit 1
          fi

          # Auto-replace spaces with hyphens
          HOTFIX_NAME=$(echo "$HOTFIX_NAME" | tr ' ' '-')
          BRANCH_NAME="hotfix/$HOTFIX_NAME"

          # Check if branch already exists (using ls-remote for reliable remote check)
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "  🚨 Branch '$BRANCH_NAME' already exists."
            echo "  Use a different name or delete the existing branch first."
            echo "============================================"
            exit 1
          fi

          # Show what we're about to do
          TAG_COMMIT=$(git rev-parse --short "$LATEST_TAG")
          TAG_DATE=$(git log -1 --format='%ci' "$LATEST_TAG")
          echo ""
          echo "  Creating branch:"
          echo "    Branch:  $BRANCH_NAME"
          echo "    From:    $LATEST_TAG (commit $TAG_COMMIT)"
          echo "    Tagged:  $TAG_DATE"
          echo ""

          # Create and push the branch
          git config user.email "github-actions@philips.com"
          git config user.name "GitHub Actions"
          git checkout -b "$BRANCH_NAME" "$LATEST_TAG"
          git push origin "$BRANCH_NAME"

          echo "  ✅ Hotfix branch created and pushed successfully!"

          # Protect the hotfix branch from accidental deletion
          REPO="${{ github.repository }}"
          echo ""
          echo "  Applying branch protection (prevent deletion)..."
          PROTECT_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/branches/$BRANCH_NAME/protection" \
            -d '{"required_status_checks":null,"enforce_admins":false,"required_pull_request_reviews":null,"restrictions":null,"allow_force_pushes":false,"allow_deletions":false}')

          if [ "$PROTECT_RESPONSE" -eq 200 ]; then
            echo "  🔒 Branch protected — cannot be deleted until merged to main."
          else
            echo "  ⚠️  Branch protection API returned HTTP $PROTECT_RESPONSE."
            echo "  Branch was created but may not be protected from deletion."
            echo "  Ensure IT_EADI_API_MGMT_GIT_TOKEN has admin/repo scope."
          fi

          echo ""
          echo "  ============================================"
          echo "  NEXT STEPS FOR DEVELOPER:"
          echo "  ============================================"
          echo "  1. Pull the branch locally:"
          echo "       git fetch origin"
          echo "       git checkout $BRANCH_NAME"
          echo ""
          echo "  2. Make your fix and commit:"
          echo "       git add ."
          echo "       git commit -m \"fix: <describe the fix>\""
          echo "       git push origin $BRANCH_NAME"
          echo ""
          echo "  3. The CI/CD pipeline will automatically:"
          echo "       - Create a release tag (create-release.yml)"
          echo "       - Deploy to Test → ACC → Prod via cd.yml (skipping Dev)"
          echo "       - Create a PR to merge fix back to main"
          echo "  ============================================"
